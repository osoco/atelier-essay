name: Build and release PDFs

on:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: |
          curl -sL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo install -m755 tectonic /usr/local/bin/tectonic

      - name: Build PDFs
        run: make

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)-$(date -u +%Y%m%d)"
          TITLE="As We May Think Software $TAG"
          NOTES="PDFs del ensayo (ES y EN) construidos automáticamente a partir de ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" essay/*.pdf --clobber
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" essay/*.pdf
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Cada push publica una nueva versión en Zenodo (también los cambios
      # del mismo día), siempre que el secret ZENODO_TOKEN esté configurado.
      - name: Deposit on Zenodo
        if: env.ZENODO_TOKEN != ''
        run: bash scripts/zenodo-deposit.sh "${{ steps.release.outputs.tag }}"
